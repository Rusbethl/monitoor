version: "3.8"

services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: btcmonitor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  collector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: btcmonitor-collector
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./scripts:/app/scripts
    command: ["python", "-u", "scripts/main.py"]

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: btcmonitor-dashboard
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./scripts:/app/scripts
    ports:
      - "${DASHBOARD_PORT:-8000}:8000"
    command: ["python", "-u", "-m", "uvicorn", "dashboard.app:app", "--app-dir", "scripts", "--host", "0.0.0.0", "--port", "8000"]

  # Opcional: LLM local gratuito para clasificar noticias antes de escalar a Telegram/Notion.
  # Descomenta si quieres usarlo (requiere GPU o CPU potente para respuestas rápidas).
